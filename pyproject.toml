[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-code-auditor"
version = "0.1.0"
description = "Privacy-preserving local code refactoring pipeline with AST analysis, RAG, and Streamlit UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "faiss-cpu>=1.8.0",
  "numpy>=1.26.4",
  "pandas>=2.2.2",
  "pylint>=3.2.0",
  "radon>=6.0.1",
  "requests>=2.32.0",
  "scikit-learn>=1.5.0",
  "streamlit>=1.36.0",
]

[tool.setuptools]
packages = ["hybrid_code_auditor"]
